<div class="min-h-screen bg-alabaster text-charcoal font-sans">
      
      <nav class="sticky top-0 z-40 bg-alabaster/90 backdrop-blur-md border-b border-sandstone/70 px-6 h-20 flex items-center justify-between">
        <a href="#" class="font-serif tracking-widest text-base font-semibold text-olive uppercase">
          E <span class="text-gold italic font-normal text-lg">&amp;</span> L
        </a>

        <div class="hidden md:flex items-center space-x-8 text-xs uppercase tracking-widest text-charcoal/80 font-medium">
          <a href="#historia" class="hover:text-gold transition">Historia</a>
          <a href="#itinerario" class="hover:text-gold transition">Itinerario</a>
          <a href="#hacienda" class="hover:text-gold transition">La Hacienda</a>
        </div>

        <div class="flex items-center gap-3">
          <button (click)="audio.toggle()" class="px-3.5 py-1.5 rounded-full border border-gold/40 text-xs text-olive font-medium flex items-center gap-1.5 hover:bg-gold/10 transition">
            <span>{{ audio.isPlaying() ? 'Pausar Música' : 'Música Andaluza' }}</span>
          </button>
          <button (click)="isRsvpOpen.set(true)" class="px-4 py-2 rounded-full bg-olive-700 text-alabaster text-xs uppercase tracking-widest font-semibold hover:bg-olive-800 transition">
            RSVP
          </button>
        </div>
      </nav>

      <app-header (openRsvp)="isRsvpOpen.set(true)" />
      
      <section id="historia" class="py-24 px-6 max-w-4xl mx-auto text-center">
        <span class="text-xs uppercase tracking-[0.3em] font-sans text-olive font-semibold">Nuestra Historia</span>
        <h2 class="font-serif text-4xl sm:text-5xl text-olive-900 mt-2 mb-6 font-light">Siete primaveras y un destino</h2>
        <p class="font-serif italic text-charcoal/80 text-lg leading-relaxed max-w-2xl mx-auto">
          "Nos conocimos en Sevilla hace siete primaveras, y desde entonces cada rincón de Andalucía ha sido testigo de nuestras risas, sueños compartidos y el compromiso que hoy consagramos."
        </p>
      </section>

      <app-wedding-timeline />

      <!-- Floating RSVP Button -->
      <div class="fixed bottom-6 right-6 z-40">
        <button (click)="isRsvpOpen.set(true)" class="px-6 py-3.5 bg-olive-700 hover:bg-olive-800 text-alabaster rounded-full shadow-floating border border-gold/40 flex items-center gap-3 transition">
          <span class="w-2.5 h-2.5 rounded-full bg-gold animate-ping"></span>
          <span class="font-sans text-xs uppercase tracking-widest font-semibold text-gold-light">Confirmar Asistencia</span>
        </button>
      </div>

      <app-assistance-form 
        [isOpen]="isRsvpOpen()"
        (close)="isRsvpOpen.set(false)"
        (submitted)="onRsvpSubmitted($event)"
      />

    </div>
